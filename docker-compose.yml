services:
  postgres:
    image: postgres:16-alpine
    container_name: yangiariq-aqua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-yangiariq_aqua}
      POSTGRES_USER: ${DATABASE_USERNAME:-${DB_USER:-aqua_user}}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-${DB_PASSWORD:-aqua_secure_password_dev}}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-${DB_USER:-aqua_user}} -d ${DB_NAME:-yangiariq_aqua}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aqua_network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: yangiariq-aqua-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-yangiariq_aqua}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-${DB_USER:-aqua_user}}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-${DB_PASSWORD:-aqua_secure_password_dev}}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-86400000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SENSOR_PROVIDER: ${SENSOR_PROVIDER:-simulated}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - aqua_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: yangiariq-aqua-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - aqua_network

volumes:
  postgres_data:
    driver: local

networks:
  aqua_network:
    driver: bridge

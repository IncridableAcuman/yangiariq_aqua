# ==============================================================================
# Render Blueprint Specification for Yangiariq Aqua AI (Agronexsus)
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Backend REST API Web Service (Java 21 + Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: yangiariq-aqua-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Paste Neon PostgreSQL connection string (postgresql://user:password@host/database?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Automatically generated secure secret for JWT tokens
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRATION
        value: "3600000"
      - key: JWT_REFRESH_TOKEN_EXPIRATION
        value: "604800000"
      # Allowed CORS origins (Render frontend URL) - no localhost in production
      - key: CORS_ALLOWED_ORIGINS
        value: "https://yangiariq-aqua-6hfh.onrender.com,https://yangiariq-aqua.onrender.com,https://yangiariq-aqua-api-6hfh.onrender.com,https://yangiariq-aqua-api.onrender.com"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Super Admin controlled bootstrap (optional on initial launch)
      - key: SUPER_ADMIN_BOOTSTRAP_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: SENSOR_PROVIDER
        value: simulated
      - key: ENABLE_SWAGGER_PROD
        value: "true"

  # ----------------------------------------------------------------------------
  # 2. React Vite Frontend Single Page Application (Static Site on Global CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: yangiariq-aqua
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://yangiariq-aqua-api-6hfh.onrender.com/api/v1
      - key: VITE_DEFAULT_LANGUAGE
        value: uz
      - key: VITE_APP_NAME
        value: "Yangiariq Aqua AI"

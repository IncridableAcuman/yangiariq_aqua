# ==============================================================================
# Render Blueprint Specification for Yangiariq Aqua AI
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Backend Web Service (Java 21 + Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: yangiariq-aqua-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Paste Neon PostgreSQL connection string (postgresql://user:password@host/database?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Automatically generated secure secret for JWT tokens
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRATION
        value: "86400000"
      - key: JWT_REFRESH_TOKEN_EXPIRATION
        value: "604800000"
      # Allowed CORS origins (Render frontend URL)
      - key: CORS_ALLOWED_ORIGINS
        value: "https://yangiariq-aqua-frontend.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: SENSOR_PROVIDER
        value: simulated

  # ----------------------------------------------------------------------------
  # 2. React Vite Frontend (Static Site served via Global CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: yangiariq-aqua-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://yangiariq-aqua-backend.onrender.com/api/v1
      - key: VITE_DEFAULT_LANGUAGE
        value: uz
      - key: VITE_APP_NAME
        value: "Yangiariq Aqua AI"

name: Pull Request Verification

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite & ArchUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x backend/gradlew

      - name: Run Backend Tests & Architecture Verification
        working-directory: ./backend
        run: ./gradlew clean test --no-daemon

      - name: Archive Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test/
          retention-days: 7

  frontend-test:
    name: Frontend Quality & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit & Integration Suite
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Production Static Asset Build
        working-directory: ./frontend
        run: npm run build

  docker-verification:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Production Docker Compose
        run: docker compose -f docker-compose.prod.yml config

      - name: Validate Production Nginx Configuration
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            -v ${{ github.workspace }}/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v ${{ github.workspace }}/docker/nginx/conf.d/aqua.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine nginx -t

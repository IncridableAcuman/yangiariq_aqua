spring:
  application:
    name: yangiariq-aqua-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yangiariq_aqua}}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USER:aqua_user}}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aqua_secure_password_dev}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${LIQUIBASE_ENABLED:true}
    drop-first: ${LIQUIBASE_DROP_FIRST:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
      access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION:${JWT_EXPIRATION_MS:86400000}}
      refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION:${JWT_REFRESH_EXPIRATION_MS:604800000}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:mock}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
  sensor:
    provider: ${SENSOR_PROVIDER:simulated}
    simulation-interval-ms: ${SENSOR_SIMULATION_INTERVAL_MS:30000}

# Spring Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    com.aquaai: DEBUG
    org.springframework.security: INFO
    org.liquibase: INFO

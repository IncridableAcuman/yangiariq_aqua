spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      pool-name: AquaHikariProdPool
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful
  forward-headers-strategy: framework

app:
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-limit-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
      refresh-limit-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:30}
      default-auth-limit-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: yangiariq-aqua-ai
      environment: prod
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    enabled: ${ENABLE_SWAGGER_PROD:false}
  swagger-ui:
    enabled: ${ENABLE_SWAGGER_PROD:false}

logging:
  level:
    root: INFO
    com.aquaai: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.liquibase: INFO
    com.zaxxer.hikari: WARN
